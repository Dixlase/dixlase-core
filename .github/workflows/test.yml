name: Dixlase Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'

# DB 接続情報を YAML アンカーで一元管理
env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: password

jobs:
  # ============================================
  # PHPUnit Tests (Core)
  # ============================================
  core-tests:
    name: Core Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch registered submodules
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # PAT でサブモジュール URL の認証を設定
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"

          # .gitmodules に登録されたサブモジュールのみ取得（未登録の gitlink は無視）
          if [ -f .gitmodules ]; then
            echo "=== Registered submodules ==="
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read key path; do
              name=$(echo "$key" | sed 's/^submodule\.\(.*\)\.path$/\1/')
              echo "Initializing: $name ($path)"
              git submodule init "$path" 2>&1 || true
            done
            echo "=== Fetching submodules ==="
            git submodule update --depth=1 --force 2>&1 || true
            echo "=== Submodule status ==="
            git submodule status 2>&1 || true
            echo "=== Plugin directories ==="
            ls -d plugins/*/ 2>/dev/null || echo "No plugin directories found"
            ls -d themes/*/ 2>/dev/null || echo "No theme directories found"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, fileinfo, ctype, curl, dom, json, openssl, tokenizer, xml, bcmath
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Generate plugin autoload mappings
        run: |
          # composer install 前に composer.local.json を生成（merge-plugin が初期化時に読めるようにする）
          php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p custom/tests/Unit custom/tests/Feature

      - name: Configure test database
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env
          echo "DB_DATABASE=dixlase_test" >> .env
          echo "DB_USERNAME=${{ env.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env

      - name: Run Core Unit Tests
        run: php artisan test --testsuite=Unit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Core Feature Tests
        run: php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Custom Tests (if custom files exist)
        if: hashFiles('custom/app/**/*.php') != ''
        run: php artisan test --testsuite=Custom
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

  # ============================================
  # PHPUnit Tests (Plugins)
  # ============================================
  plugin-tests:
    name: Plugin Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: core-tests

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch registered submodules
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # PAT でサブモジュール URL の認証を設定
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"

          # .gitmodules に登録されたサブモジュールのみ取得（未登録の gitlink は無視）
          if [ -f .gitmodules ]; then
            echo "=== Registered submodules ==="
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read key path; do
              name=$(echo "$key" | sed 's/^submodule\.\(.*\)\.path$/\1/')
              echo "Initializing: $name ($path)"
              git submodule init "$path" 2>&1 || true
            done
            echo "=== Fetching submodules ==="
            git submodule update --depth=1 --force 2>&1 || true
            echo "=== Plugin directories ==="
            ls -d plugins/*/ 2>/dev/null || echo "No plugin directories found"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, fileinfo, ctype, curl, dom, json, openssl, tokenizer, xml, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Generate plugin autoload mappings
        run: php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p custom/tests/Unit custom/tests/Feature
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env
          echo "DB_DATABASE=dixlase_test" >> .env
          echo "DB_USERNAME=${{ env.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env

      - name: Run Plugin Tests (Tier 1 - Well Tested)
        run: >-
          php artisan test
          --testsuite=DixlaseLegal,DixlaseInquiry,DixlaseSEO,DixlaseCoreDevKit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Plugin Tests (Tier 2 - Moderate)
        run: >-
          php artisan test
          --testsuite=DixlaseOfficialDocs,DixlaseMenus,DixlasePages,DixlaseGUIEditorLite,DixlaseDevKit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Plugin Tests (Tier 3 - Minimal)
        run: >-
          php artisan test
          --testsuite=DixlaseAi,DixlaseUsers,DixlaseAuthority,DixlaseBackup,DixlaseDeploy,DixlaseMultilingual
        continue-on-error: true
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

  # ============================================
  # Code Style (Laravel Pint)
  # ============================================
  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test
        continue-on-error: true  # 既存ファイルのスタイル統一は段階的に実施

  # ============================================
  # Static Analysis (PHPStan)
  # ============================================
  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G
        continue-on-error: true  # アルファ版では警告のみ

  # ============================================
  # Security Audit
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Composer Audit
        run: composer audit

  # ============================================
  # Migration Test
  # ============================================
  migration:
    name: Migration Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_migration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch registered submodules
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          # PAT でサブモジュール URL の認証を設定
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"

          # .gitmodules に登録されたサブモジュールのみ取得（未登録の gitlink は無視）
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read key path; do
              name=$(echo "$key" | sed 's/^submodule\.\(.*\)\.path$/\1/')
              echo "Initializing: $name ($path)"
              git submodule init "$path" 2>&1 || true
            done
            echo "=== Fetching submodules ==="
            git submodule update --depth=1 --force 2>&1 || true
            echo "=== Plugin directories ==="
            ls -d plugins/*/ 2>/dev/null || echo "No plugin directories found"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Generate plugin autoload mappings
        run: php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p custom/tests/Unit custom/tests/Feature

      - name: Test migrate:fresh
        run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_migration
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Test migrate:rollback
        run: php artisan migrate:rollback --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_migration
          DB_USERNAME: root
          DB_PASSWORD: password
