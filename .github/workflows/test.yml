name: Dixlase Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop
      - v0.1.0
    paths-ignore:
      - '**.md'
      - 'docs/**'

# DB 接続情報を YAML アンカーで一元管理
env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: password
  # GitHub OAuth token for composer to clone private dependencies
  # (currently: dixlase/dixlase-onepage). Fine-grained PAT with
  # Contents:Read on Dixlase/theme-dixlase-onepage only — see secret
  # COMPOSER_AUTH in repo or organization settings.
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

# Cancel older runs on the same ref when a new one starts.
# Saves Actions minutes on rebases / quick consecutive pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # PHPUnit Tests (Core)
  # ============================================
  core-tests:
    name: Core Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch integration plugins
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          .github/scripts/fetch-integration-plugins.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, fileinfo, ctype, curl, dom, json, openssl, tokenizer, xml, bcmath
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Generate plugin autoload mappings
        run: |
          # composer install 前に composer.local.json を生成（merge-plugin が初期化時に読めるようにする）
          php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p custom/tests/Unit custom/tests/Feature

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets (Vite manifest)
        run: npm run build

      - name: Configure test database
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env
          echo "DB_DATABASE=dixlase_test" >> .env
          echo "DB_USERNAME=${{ env.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env

      - name: Run Core Unit Tests
        run: php artisan test --testsuite=Unit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Core Feature Tests
        run: php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Custom Tests (if custom files exist)
        if: hashFiles('custom/app/**/*.php') != ''
        run: php artisan test --testsuite=Custom
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

  # ============================================
  # PHPUnit Tests (Plugins)
  # ============================================
  plugin-tests:
    name: Plugin Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: core-tests

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch integration plugins
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          .github/scripts/fetch-integration-plugins.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, fileinfo, ctype, curl, dom, json, openssl, tokenizer, xml, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Generate plugin autoload mappings
        run: php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p custom/tests/Unit custom/tests/Feature
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env
          echo "DB_DATABASE=dixlase_test" >> .env
          echo "DB_USERNAME=${{ env.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env

      - name: Run Plugin Tests (Tier 1 - Well Tested)
        run: >-
          php artisan test
          --testsuite=DixlaseLegal,DixlaseInquiry,DixlaseSEO,DixlaseCoreDevKit,DixlaseSigner,DixlaseMultilingual
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Plugin Tests (Tier 2 - Moderate)
        run: >-
          php artisan test
          --testsuite=DixlaseOfficialDocs,DixlaseMenus,DixlasePages,DixlaseDevKit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

      - name: Run Plugin Tests (Tier 3 - Minimal)
        run: >-
          php artisan test
          --testsuite=DixlaseAi,DixlaseUsers,DixlaseAuthority
        continue-on-error: true
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: dixlase_test

  # ============================================
  # Code Style (Laravel Pint)
  # ============================================
  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  # ============================================
  # Static Analysis (PHPStan)
  # ============================================
  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

  # ============================================
  # Missing Symbols — BLOCKING
  # ============================================
  # Deliberately separate from the job above. That one runs at level 5 with
  # ~650 findings and stays advisory while they are worked down; this one runs
  # a narrow config that reports only symbols which are named but do not exist,
  # and it must fail the build.
  #
  # The split exists because "wait until everything is green" kept this class
  # of defect unguarded. A sweep in 2026-08 found eleven features that were
  # registered but died the moment they ran — plugin download, theme asset
  # delivery, Markdown rendering, async webhooks, the 2FA trusted-device check
  # and more. PHPStan had reported every one of them; nobody saw it, because
  # its CI job could not fail. Some had been broken for months.
  missing-symbols:
    name: Missing Symbols (blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # No --no-dev: larastan itself is a dev dependency, and without it the
      # Laravel-aware resolution this config relies on is absent.
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for references to symbols that do not exist
        run: ./vendor/bin/phpstan analyse -c phpstan-notfound.neon --memory-limit=2G

  # ============================================
  # Migration Test
  # ============================================
  migration:
    name: Migration Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dixlase_migration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch integration plugins
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          .github/scripts/fetch-integration-plugins.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Generate plugin autoload mappings
        run: php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p custom/tests/Unit custom/tests/Feature

      - name: Test migrate:fresh
        run: php artisan migrate:fresh --seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_migration
          DB_USERNAME: root
          DB_PASSWORD: password

      - name: Test migrate:rollback
        run: php artisan migrate:rollback --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_migration
          DB_USERNAME: root
          DB_PASSWORD: password

  # ============================================
  # Migration Immutability Lint (Tier 1 blocking, GA onward)
  # ============================================
  # Enforces the GA migration immutability policy: once
  # database/migration-lock.json is committed (just before the GA
  # release tag, after the Beta 1 → GA beta series), any edit,
  # deletion, or post-lock 0001_01_01_* addition to a locked migration
  # file fails CI. During the beta series no lock file exists and
  # `dls:migration:lint` exits 0, so schema churn is unblocked.
  # Locks across core + registered plugins + registered themes.
  # See: docs/operations/upgrading.md and CLAUDE.md "Migration Editing Policy".
  migration-lint:
    name: Migration Immutability Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch integration plugins
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          .github/scripts/fetch-integration-plugins.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Generate plugin autoload mappings
        run: php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run dls:migration:lint
        run: php artisan dls:migration:lint

  # ============================================
  # Comment-Translation Coverage (warning mode)
  # ============================================
  # Reports comment-translation coverage on every PR / push as a
  # non-blocking warning. Pending entries surface in the job log so
  # contributors notice them, but the build is not failed — that gate
  # is enforced separately by the release workflow (see
  # laravel-ci.yml -> "Comment translation coverage (strict)").
  comment-translation-status:
    name: Comment Translation Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Fetch integration plugins
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
          .github/scripts/fetch-integration-plugins.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Generate plugin autoload mappings
        run: php scripts/sync-local-autoload.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare minimal environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Report comment-translation coverage (warning mode)
        run: |
          echo "::group::dls:comment:status (locale=ja)"
          php artisan dls:comment:status --include-plugins --include-themes
          echo "::endgroup::"
          echo ""
          echo "Note: this job is informational. Pending entries do not"
          echo "fail the PR. The release workflow enforces --strict on"
          echo "v* tags so a release cannot ship with translation gaps."
