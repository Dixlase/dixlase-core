# Dixlase auto-deploy workflow
name: Deploy Dixlase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/dixlase-core" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create shared build directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p ${{ steps.target.outputs.base_dir }}/_shared/build

      - name: Deploy built assets via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/assets/build/
          remote_path: ${{ steps.target.outputs.base_dir }}/_shared/build/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"

            # Recoverable per-site problems set this instead of killing the
            # loop, so one site cannot stop the sites after it from being
            # deployed. The run still goes red: the flag is checked after the
            # loop. A silent skip is what let authority go undeployed for
            # months, so nothing here may fail quietly.
            DEPLOY_FAILURES=0

            for SITE in brand docs demo; do
              echo "=== Deploying $SITE (${{ steps.target.outputs.env }}) ==="

              # 0. サイトが未セットアップなら skip
              # 本番サーバー側に $BASE/$SITE が存在しない (host) か、
              # compose-php-1 の /var/www/apps/$SITE が存在しない (container)
              # 状態ならそのサイトは未セットアップ扱いで通過させる。
              # これがないと bind mount が未追加のサイトで
              # `cd: ... No such file or directory` or `chown: cannot access`
              # で loop 全体が exit 1 して以降のサイトに deploy できなくなる。
              if [ ! -d "$BASE/$SITE" ]; then
                echo "  Skipping: host path $BASE/$SITE does not exist"
                continue
              fi
              if ! docker exec compose-php-1 test -d "/var/www/apps/$SITE"; then
                echo "  Skipping: container path /var/www/apps/$SITE does not exist"
                continue
              fi

              cd "$BASE/$SITE"

              # 1. deploy ユーザーが git 操作できるよう所有権を戻す
              # `-h` (lchown) を付けて symlink 自身に chown する。symlink を
              # 辿った結果リンク先が無い (broken symlink) と chown -R が
              # "No such file or directory" で exit 1 する事故が起きるため。
              # 過去のプラグイン install/uninstall の名残として database/
              # migrations/ などに broken symlink が残っていてもこれで通る。
              docker exec compose-php-1 chown -hR 1001:1001 /var/www/apps/$SITE

              # 1-b. 半壊 submodule pointer のクリーンアップ
              # plugins/*/.git や themes/*/.git の gitfile が残っているのに
              # 指す先の .git/modules/* が存在しないと、git reset --hard が
              # gitlink を進めようとして "not a git repository" で死ぬ。
              # 該当 gitfile を消すことで該当パスは untracked dir 扱いになり
              # reset が通るようになる (作業ツリーのファイルは保持される)。
              for gitfile in plugins/*/.git themes/*/.git; do
                [ -f "$gitfile" ] || continue
                gitdir=$(sed -n 's/^gitdir: //p' "$gitfile" 2>/dev/null)
                [ -n "$gitdir" ] || continue
                parent=$(dirname "$gitfile")
                if [ ! -d "$parent/$gitdir" ]; then
                  echo "Removing orphan submodule pointer: $gitfile"
                  rm -f "$gitfile"
                fi
              done

              # 2. コードを最新に更新
              git fetch origin
              git reset --hard origin/main

              # 3. ストレージディレクトリの復元（git reset で消える場合がある）
              mkdir -p storage/framework/{views,cache/data,sessions} storage/logs bootstrap/cache

              # 3-b. Remove leftovers of the old DixlaseAuthority plugin.
              # It was renamed to DixlasePublicKeys and dropped from core's
              # submodules; a copy left under the old name would declare the
              # same classes twice. authority is not deployed by this workflow.
              case "$SITE" in
                brand|docs|demo)
                  if [ -e plugins/DixlaseAuthority ]; then
                    rm -rf plugins/DixlaseAuthority
                  fi
                  rm -rf .git/modules/plugins/DixlaseAuthority 2>/dev/null || true
                  ;;
              esac

              # 4. Composer 依存関係とオートロード更新
              if [ -f composer.json ]; then
                docker exec compose-php-1 bash -c \
                  "cd /var/www/apps/$SITE && composer install --no-dev --no-interaction --optimize-autoloader"
              fi

              # 4-b. Composer がテーマの作業ツリーを置き換えていたら git 管理下に戻す
              # themes/DixlaseOnePage は Composer (installer-paths) とテーマ側の
              # deploy (git clone) の両方が同じパスを所有している。lock の参照が
              # 動くと手順 4 がディレクトリを入れ替えて zip を展開し直すため、
              # .git が失われ、テーマは lock の古い参照まで静かに巻き戻り、次の
              # テーマ deploy は .git が無いのを見て退避コピーを作る。
              #
              # 発火条件を「.git が無い」に限定しているのは、運用者が
              # dls:theme:rollback で戻した状態を上書きしないため (その場合 .git は
              # 残る)。ここが動くのは Composer が直前に置き換えたときだけで、
              # そのとき運用者の状態はすでに失われている。
              #
              # ディレクトリは削除せず、その場で git 管理下に戻して main に
              # 合わせる。恒久対応は Composer に所有させるのをやめること
              # (バックログ theme-directory-dual-ownership)。
              if [ -d themes/DixlaseOnePage ] && [ ! -d themes/DixlaseOnePage/.git ]; then
                echo "  themes/DixlaseOnePage has no .git — Composer replaced it; re-adopting the checkout"

                # 手順 4 の composer install は docker exec でコンテナ内の root と
                # して走るため、展開し直されたテーマは root 所有になる。この後の
                # git 操作はホスト側の deploy ユーザーで走るので、所有権を戻して
                # おかないと .git を作れず "Permission denied" で落ちる。手順 1 が
                # サイト全体に対して行っているのと同じ chown をここでも行う。
                docker exec compose-php-1 chown -R 1001:1001 \
                  "/var/www/apps/$SITE/themes/DixlaseOnePage"

                # `&&` で連結して失敗を伝播させる。`set -e` は if の条件部では
                # 無効になるため、ここでは頼れない。
                if git -C themes/DixlaseOnePage init -q \
                  && git -C themes/DixlaseOnePage remote add origin \
                       git@github.com:Dixlase/theme-dixlase-onepage.git \
                  && git -C themes/DixlaseOnePage fetch --depth=1 -q origin main \
                  && git -C themes/DixlaseOnePage reset --hard -q FETCH_HEAD; then
                  docker exec compose-php-1 bash -c \
                    "cd /var/www/apps/$SITE && php scripts/sync-local-autoload.php" || true
                else
                  # ここで exit すると後続サイトが丸ごとデプロイされなくなる。
                  # テーマの中身は lock の参照どおりに展開済みで、欠けているのは
                  # 作業ツリーの .git だけなので、記録して次のサイトへ進む。
                  echo "::error::$SITE: failed to re-adopt themes/DixlaseOnePage; the theme content is in place but has no checkout"
                  DEPLOY_FAILURES=1
                fi
              fi

              # 5. CIでビルド済みのフロントエンドアセットをコピー
              mkdir -p public/assets/build
              rsync -a "$BASE/_shared/build/" public/assets/build/

              # 6. パーミッション修正（www-data が .env とルートに書き込めるように）
              docker exec compose-php-1 chown www-data:www-data /var/www/apps/$SITE
              [ -f .env ] && docker exec compose-php-1 chown www-data:www-data /var/www/apps/$SITE/.env
              # 所有権も戻す。手順 4 の composer install は docker exec 経由の root で
              # 走り、その post-autoload-dump が artisan package:discover を呼ぶため、
              # bootstrap/cache/packages.php と services.php が root 所有で作られる
              # (2026-09-24 に 4 サイト全てで確認)。chmod 777 だけだと所有権は root の
              # ままで、パーミッションのビットだけが「PHP-FPM が書き換えられない
              # キャッシュ」との間に立っている状態になる。
              docker exec compose-php-1 chown -R www-data:www-data /var/www/apps/$SITE/storage /var/www/apps/$SITE/bootstrap/cache
              docker exec compose-php-1 chmod -R 777 /var/www/apps/$SITE/storage /var/www/apps/$SITE/bootstrap/cache

              # 6-b. public/ ディレクトリのグループを www-data に戻す
              # 手順1の chown -hR 1001:1001 で www-data グループ設定が消えるため、毎回再適用
              # deploy ユーザーは www-data グループのメンバーなので両者が書き込み可能
              # chgrp も `-h` 付きで symlink を辿らないようにする (broken symlink 対策)
              docker exec compose-php-1 chgrp -hR www-data /var/www/apps/$SITE/public
              docker exec compose-php-1 chmod -R g+w /var/www/apps/$SITE/public
              docker exec compose-php-1 find /var/www/apps/$SITE/public -type d -exec chmod g+s {} +

              # 7. キャッシュクリア（コンテナ内で実行してパス不一致を防ぐ）
              # `-u www-data` は必須。付けないと docker exec は root で走り、
              # artisan が書くもの (ログ、再生成されたキャッシュ) が root 所有になる。
              # なお 2026-09-24 に 4 サイト全てで確認された root 所有の
              # bootstrap/cache/packages.php・services.php を作っていたのは、この
              # ステップではなく手順 4 の composer install が呼ぶ package:discover
              # である。そちらは手順 6 に chown を足して手当てした。
              # 手順 1・6 の chown / chmod は root が必要なのでそのままにする。
              if [ -f artisan ]; then
                docker exec -u www-data compose-php-1 php /var/www/apps/$SITE/artisan config:clear
                docker exec -u www-data compose-php-1 php /var/www/apps/$SITE/artisan view:clear
                docker exec -u www-data compose-php-1 php /var/www/apps/$SITE/artisan route:clear
              fi
            done

            if [ "$DEPLOY_FAILURES" != "0" ]; then
              echo "=== Deploy finished with errors — see the ::error:: lines above ==="
              exit 1
            fi

            echo "=== Deploy complete ==="
