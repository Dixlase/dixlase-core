# Dixlase deploy workflow
name: Deploy Dixlase

# A production site receives only a released tag, never the tip of a branch
# (dixlase-core#520). A merge to `main` used to deploy, which meant whatever
# had just been merged was serving traffic before anyone decided it should
# be: there was no point at which a person said "this version goes out".
#
#   - `release: published` deploys that release's tag.
#   - `workflow_dispatch` deploys a tag you name, which is how a specific
#     version is put somewhere deliberately. The rule says to dispatch the
#     workflow at the ref you want rather than work on the server by hand,
#     and until now this workflow offered no way to do that.
#
# Nothing here deploys a branch: `main` moving has no effect on production.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v0.1.8). It must already exist on the remote.'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag to deploy
        id: release
        env:
          # Both values come from the repository -- a release GitHub created,
          # or an input that needed workflow-write access to send -- but they
          # are still read through the environment instead of being
          # interpolated into the script, so a tag name can never be parsed
          # as shell.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag to deploy: neither a release tag nor a dispatch input was given"
            exit 1
          fi
          case "$TAG" in
            *[!A-Za-z0-9._/-]*)
              echo "::error::Refusing tag '$TAG': it contains characters a tag name may not have"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag $TAG"

      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          # Explicit, because a workflow_dispatch run would otherwise check
          # out the branch it was dispatched from rather than the tag being
          # deployed, and the assets built below would come from the wrong
          # tree.
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/dixlase-core" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create shared build directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p ${{ steps.target.outputs.base_dir }}/_shared/build

      - name: Deploy built assets via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/assets/build/
          remote_path: ${{ steps.target.outputs.base_dir }}/_shared/build/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TAG: ${{ steps.release.outputs.tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Forwarded rather than interpolated into the script below, so the
          # tag reaches the server as a value and not as shell source.
          envs: DEPLOY_TAG
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"

            if [ -z "$DEPLOY_TAG" ]; then
              echo "::error::DEPLOY_TAG did not reach the server"
              exit 1
            fi
            echo "=== Deploying tag $DEPLOY_TAG ==="

            # Recoverable per-site problems set this instead of killing the
            # loop, so one site cannot stop the sites after it from being
            # deployed. The run still goes red: the flag is checked after the
            # loop. A silent skip is what let authority go undeployed for
            # months, so nothing here may fail quietly.
            DEPLOY_FAILURES=0

            # The sites this workflow updates. A production site that is
            # deliberately left out is left out of this list -- the signing-key
            # site stays operator-triggered (dixlase-core#472), so it is absent
            # here rather than skipped at run time.
            for SITE in brand docs demo; do
              echo "=== Deploying $SITE (${{ steps.target.outputs.env }}) ==="

              # 0. Resolve the site's container and paths.
              #
              # Two layouts are in use. In the shared stack several sites live
              # in one container, each under /var/www/apps/<site>. In the Docker
              # installer layout the site is its own compose stack: core sits in
              # html/ and is mounted at /var/www/html. The container name comes
              # from the site's own .env (CONTAINER_PREFIX), so the layout is
              # read off the server rather than written down here.
              #
              # A site that resolves to neither layout is an error, not a skip.
              # The guard this replaced treated a missing path as "not set up
              # yet" and continued, which is how production sites went
              # undeployed for weeks while every run reported success (#470).
              # Recording the failure instead of exiting keeps the sites after
              # this one deployable; the flag turns the run red after the loop.
              SITE_DIR="$BASE/$SITE"

              if [ ! -d "$SITE_DIR" ]; then
                echo "::error::$SITE: $SITE_DIR does not exist on the server"
                DEPLOY_FAILURES=1
                continue
              fi

              if [ -f "$SITE_DIR/html/artisan" ]; then
                # Docker installer layout. `tr -d` strips quotes (\042, \047) and
                # a CR, so a value written as CONTAINER_PREFIX="x" still resolves.
                PREFIX=$(sed -n 's/^CONTAINER_PREFIX=//p' "$SITE_DIR/.env" 2>/dev/null | head -n 1 | tr -d '\042\047\r')
                CONTAINER="${PREFIX:-dixlase}-app"
                APP_DIR="$SITE_DIR/html"
                APP_PATH="/var/www/html"
                # The host tree is owned by the deploy user with the www-data
                # group and the setgid bit; keep that group so www-data can
                # still write what it has to write.
                OWNER="1001:33"
                # The installer keeps the dev packages in vendor/, and their
                # service providers are in the discovered-provider cache, so
                # --no-dev here would take every request down (see step 4).
                NO_DEV=""
                # Its vendor/ is owned by the deploy user with the www-data
                # group, which is also what the product's own updater writes
                # as, so Composer runs as www-data rather than root. HOME has
                # to be writable, and Composer asks git for the version of the
                # tree it is in -- which refuses a checkout owned by another
                # user, so safe.directory is passed through the environment
                # rather than written into a config file.
                RUN_AS="-u www-data -e HOME=/tmp -e COMPOSER_HOME=/tmp/composer -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=$APP_PATH"
              elif [ -f "$SITE_DIR/artisan" ]; then
                # Shared stack.
                CONTAINER="compose-php-1"
                APP_DIR="$SITE_DIR"
                APP_PATH="/var/www/apps/$SITE"
                OWNER="1001:1001"
                NO_DEV="--no-dev"
                RUN_AS=""
              else
                echo "::error::$SITE: no artisan at $SITE_DIR/artisan or $SITE_DIR/html/artisan, so the layout is unknown"
                DEPLOY_FAILURES=1
                continue
              fi

              if ! docker exec "$CONTAINER" test -d "$APP_PATH"; then
                echo "::error::$SITE: container $CONTAINER has no $APP_PATH"
                DEPLOY_FAILURES=1
                continue
              fi

              echo "  layout: host=$APP_DIR container=$CONTAINER path=$APP_PATH"

              cd "$APP_DIR"

              # 1. deploy ユーザーが git 操作できるよう所有権を戻す
              # `-h` (lchown) を付けて symlink 自身に chown する。symlink を
              # 辿った結果リンク先が無い (broken symlink) と chown -R が
              # "No such file or directory" で exit 1 する事故が起きるため。
              # 過去のプラグイン install/uninstall の名残として database/
              # migrations/ などに broken symlink が残っていてもこれで通る。
              docker exec "$CONTAINER" chown -hR "$OWNER" "$APP_PATH"

              # 1-a. Composer がテーマを差し替えられるよう、themes/ にグループの
              # 書き込みビットを立てる。上の chown はグループを web グループに
              # するだけで、モードには触らない。テーマ側の deploy は
              # themes/DixlaseOnePage/resources/assets/ を自分の umask で rsync
              # するため、そこだけ 755 のまま残る。ファイルの削除には親ディレクトリ
              # の書き込み権が必要で、手順 4 の Composer は Docker インストーラの
              # 構成では www-data として走るので、lock が動いたときに差し替えが
              # "Could not delete" で失敗する (#537)。
              #
              # 毎回やり直す理由は、これが一度で済む修正ではないことである。
              # テーマがデプロイされるたびにモードは 755 に戻る。
              if docker exec "$CONTAINER" test -d "$APP_PATH/themes"; then
                docker exec "$CONTAINER" chmod -R g+w "$APP_PATH/themes"
              fi

              # 1-b. 半壊 submodule pointer のクリーンアップ
              # plugins/*/.git や themes/*/.git の gitfile が残っているのに
              # 指す先の .git/modules/* が存在しないと、git reset --hard が
              # gitlink を進めようとして "not a git repository" で死ぬ。
              # 該当 gitfile を消すことで該当パスは untracked dir 扱いになり
              # reset が通るようになる (作業ツリーのファイルは保持される)。
              for gitfile in plugins/*/.git themes/*/.git; do
                [ -f "$gitfile" ] || continue
                gitdir=$(sed -n 's/^gitdir: //p' "$gitfile" 2>/dev/null)
                [ -n "$gitdir" ] || continue
                parent=$(dirname "$gitfile")
                if [ ! -d "$parent/$gitdir" ]; then
                  echo "Removing orphan submodule pointer: $gitfile"
                  rm -f "$gitfile"
                fi
              done

              # 2. コードを最新に更新
              # Composer は、この deploy で composer.lock が実際に動いたときだけ
              # 走らせたい (手順 4)。reset の前の中身を控えておく。
              LOCK_BEFORE=$(sha256sum composer.lock 2>/dev/null | cut -d" " -f1)
              # `--tags --force` because a tag moved upstream has to move
              # here too, and a fetch without it keeps the old object.
              git fetch origin --tags --force
              if ! git rev-parse -q --verify "refs/tags/$DEPLOY_TAG" >/dev/null; then
                echo "::error::$SITE: tag $DEPLOY_TAG is not on this checkout after fetching"
                DEPLOY_FAILURES=1
                continue
              fi
              git reset --hard "refs/tags/$DEPLOY_TAG"

              # 3. ストレージディレクトリの復元（git reset で消える場合がある）
              mkdir -p storage/framework/{views,cache/data,sessions} storage/logs bootstrap/cache

              # 3-b. Remove leftovers of the old DixlaseAuthority plugin.
              # It was renamed to DixlasePublicKeys and dropped from core's
              # submodules; a copy left under the old name would declare the
              # same classes twice. authority is not deployed by this workflow.
              case "$SITE" in
                brand|docs|demo)
                  if [ -e plugins/DixlaseAuthority ]; then
                    rm -rf plugins/DixlaseAuthority
                  fi
                  rm -rf .git/modules/plugins/DixlaseAuthority 2>/dev/null || true
                  ;;
              esac

              # 4. Composer 依存関係とオートロード更新
              #
              # 本番ツリーで Composer を走らせるのは避けたい。同梱テーマの dist を
              # 配置済みの checkout に再展開して入れ子の .git を壊す手順そのもの
              # であり (後始末が手順 4-b)、恒久対応は #483 である。そこで、この
              # deploy で composer.lock が実際に動いたとき、または vendor がまだ
              # 無いときだけ走らせる。lock が動いていなければ vendor は既に
              # その lock どおりなので、走らせる理由が無い。
              #
              # --no-dev は共有の構成にだけ付ける。Docker インストーラの構成は
              # dev パッケージを vendor に入れたまま運用しており、discover 済み
              # プロバイダのキャッシュにもそれらが載っているため、--no-dev で
              # vendor から外すと毎リクエストが package discovery で落ちる。
              LOCK_AFTER=$(sha256sum composer.lock 2>/dev/null | cut -d" " -f1)
              if [ ! -f composer.json ]; then
                echo "  composer: no composer.json"
              elif [ "$LOCK_BEFORE" = "$LOCK_AFTER" ] && [ -f vendor/autoload.php ]; then
                echo "  composer: composer.lock unchanged and vendor present, so not running Composer"
              else
                echo "  composer: running install$NO_DEV"
                # 失敗しても `set -e` でここで止めない。止まる位置が最悪で、
                # ツリーはすでに新しいタグに移っており、Composer はテーマを
                # 大半削除したあとで、しかも手順 4-b の再採用・手順 5 のアセット
                # のコピー・手順 6 の権限の修正・手順 7 のキャッシュの破棄・
                # 手順 8 のバージョン台帳の整合のすべてより前である。サイトは
                # 半分消えたテーマを配り続け、それが Composer の autoload 段階
                # での fatal なので HTTP 200 のまま本文だけが小さくなる (#537)。
                # 失敗は記録して run を赤にし、残りの工程は通す。
                if ! docker exec $RUN_AS "$CONTAINER" bash -c \
                  "cd $APP_PATH && composer install $NO_DEV --no-interaction --optimize-autoloader"; then
                  echo "::error::$SITE: composer install failed; continuing so the theme is re-adopted and the caches are cleared"
                  DEPLOY_FAILURES=1
                fi
              fi

              # 4-b. Composer がテーマの作業ツリーを置き換えていたら git 管理下に戻す
              # themes/DixlaseOnePage は Composer (installer-paths) とテーマ側の
              # deploy (git clone) の両方が同じパスを所有している。lock の参照が
              # 動くと手順 4 がディレクトリを入れ替えて zip を展開し直すため、
              # .git が失われ、テーマは lock の古い参照まで静かに巻き戻り、次の
              # テーマ deploy は .git が無いのを見て退避コピーを作る。
              #
              # 発火条件を「.git が無い」に限定しているのは、運用者が
              # dls:theme:rollback で戻した状態を上書きしないため (その場合 .git は
              # 残る)。ここが動くのは Composer が直前に置き換えたときだけで、
              # そのとき運用者の状態はすでに失われている。
              #
              # ディレクトリは削除せず、その場で git 管理下に戻して main に
              # 合わせる。恒久対応は Composer に所有させるのをやめること
              # (バックログ theme-directory-dual-ownership)。
              if [ -d themes/DixlaseOnePage ] && [ ! -d themes/DixlaseOnePage/.git ]; then
                echo "  themes/DixlaseOnePage has no .git — Composer replaced it; re-adopting the checkout"

                # 手順 4 の composer install は docker exec でコンテナ内の root と
                # して走るため、展開し直されたテーマは root 所有になる。この後の
                # git 操作はホスト側の deploy ユーザーで走るので、所有権を戻して
                # おかないと .git を作れず "Permission denied" で落ちる。手順 1 が
                # サイト全体に対して行っているのと同じ chown をここでも行う。
                docker exec "$CONTAINER" chown -R 1001:1001 \
                  "$APP_PATH/themes/DixlaseOnePage"

                # `&&` で連結して失敗を伝播させる。`set -e` は if の条件部では
                # 無効になるため、ここでは頼れない。
                if git -C themes/DixlaseOnePage init -q \
                  && git -C themes/DixlaseOnePage remote add origin \
                       git@github.com:Dixlase/theme-dixlase-onepage.git \
                  && git -C themes/DixlaseOnePage fetch --depth=1 -q origin main \
                  && git -C themes/DixlaseOnePage reset --hard -q FETCH_HEAD; then
                  docker exec "$CONTAINER" bash -c \
                    "cd $APP_PATH && php scripts/sync-local-autoload.php" || true
                else
                  # ここで exit すると後続サイトが丸ごとデプロイされなくなる。
                  # テーマの中身は lock の参照どおりに展開済みで、欠けているのは
                  # 作業ツリーの .git だけなので、記録して次のサイトへ進む。
                  echo "::error::$SITE: failed to re-adopt themes/DixlaseOnePage; the theme content is in place but has no checkout"
                  DEPLOY_FAILURES=1
                fi
              fi

              # 5. CIでビルド済みのフロントエンドアセットをコピー
              mkdir -p public/assets/build
              rsync -a "$BASE/_shared/build/" public/assets/build/

              # 6. パーミッション修正（www-data が .env とルートに書き込めるように）
              docker exec "$CONTAINER" chown www-data:www-data "$APP_PATH"
              [ -f .env ] && docker exec "$CONTAINER" chown www-data:www-data "$APP_PATH/.env"
              # 所有権も戻す。手順 4 の composer install は docker exec 経由の root で
              # 走り、その post-autoload-dump が artisan package:discover を呼ぶため、
              # bootstrap/cache/packages.php と services.php が root 所有で作られる
              # (2026-09-24 に 4 サイト全てで確認)。chmod 777 だけだと所有権は root の
              # ままで、パーミッションのビットだけが「PHP-FPM が書き換えられない
              # キャッシュ」との間に立っている状態になる。
              docker exec "$CONTAINER" chown -R www-data:www-data "$APP_PATH/storage" "$APP_PATH/bootstrap/cache"
              docker exec "$CONTAINER" chmod -R 777 "$APP_PATH/storage" "$APP_PATH/bootstrap/cache"

              # 6-b. public/ ディレクトリのグループを www-data に戻す
              # 手順1の chown -hR 1001:1001 で www-data グループ設定が消えるため、毎回再適用
              # deploy ユーザーは www-data グループのメンバーなので両者が書き込み可能
              # chgrp も `-h` 付きで symlink を辿らないようにする (broken symlink 対策)
              docker exec "$CONTAINER" chgrp -hR www-data "$APP_PATH/public"
              docker exec "$CONTAINER" chmod -R g+w "$APP_PATH/public"
              docker exec "$CONTAINER" find "$APP_PATH/public" -type d -exec chmod g+s {} +

              # 7. キャッシュクリア（コンテナ内で実行してパス不一致を防ぐ）
              # `-u www-data` は必須。付けないと docker exec は root で走り、
              # artisan が書くもの (ログ、再生成されたキャッシュ) が root 所有になる。
              # なお 2026-09-24 に 4 サイト全てで確認された root 所有の
              # bootstrap/cache/packages.php・services.php を作っていたのは、この
              # ステップではなく手順 4 の composer install が呼ぶ package:discover
              # である。そちらは手順 6 に chown を足して手当てした。
              # 手順 1・6 の chown / chmod は root が必要なのでそのままにする。
              #
              # 手順 4 の Composer が失敗していると autoload が壊れていて
              # artisan が起動しない。素で呼ぶと `set -e` がここでスクリプトを
              # 落とし、このサイト以降のサイトが丸ごとデプロイされなくなる。
              # 4-b が「ここで exit すると後続サイトが丸ごとデプロイされなく
              # なる」と書いているのと同じ理由で、記録して次へ進む。
              if [ -f artisan ]; then
                for cache in config:clear view:clear route:clear; do
                  if ! docker exec -u www-data "$CONTAINER" php "$APP_PATH/artisan" "$cache"; then
                    echo "::error::$SITE: artisan $cache failed"
                    DEPLOY_FAILURES=1
                  fi
                done
              fi

              # 8. Bring the recorded extension versions back in line with the
              # manifests this deploy just placed. Without it the admin panel
              # offers an update to a version that is already on disk, and
              # accepting that offer deletes the directory the deploy owns
              # (dixlase-core#521). `HOME` is set because artisan writes through
              # it. A failure here is a warning, not a deploy failure: the files
              # are already live, and the daily dls:extensions:rescan reconciles
              # as well.
              if [ -f artisan ]; then
                docker exec -u www-data -e HOME=/tmp "$CONTAINER" \
                  php "$APP_PATH/artisan" dls:extensions:reconcile-versions \
                  || echo "  warning: $SITE: could not reconcile the extension versions"
              fi
            done

            if [ "$DEPLOY_FAILURES" != "0" ]; then
              echo "=== Deploy finished with errors — see the ::error:: lines above ==="
              exit 1
            fi

            echo "=== Deploy complete ==="
