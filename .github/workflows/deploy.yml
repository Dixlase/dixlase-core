# Dixlase auto-deploy workflow
name: Deploy Dixlase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.repository }}" = "Dixlase/dixlase-core" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "base_dir=/srv/dixlase/staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Create shared build directory on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p ${{ steps.target.outputs.base_dir }}/_shared/build

      - name: Deploy built assets via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/assets/build/
          remote_path: ${{ steps.target.outputs.base_dir }}/_shared/build/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            BASE="${{ steps.target.outputs.base_dir }}"

            for SITE in brand docs demo keys; do
              echo "=== Deploying $SITE (${{ steps.target.outputs.env }}) ==="
              cd "$BASE/$SITE"

              # gitが管理するファイルの所有権をデプロイユーザーに修正（パーミッションエラー回避）
              sudo chown -R "$USER":"$USER" .
              git fetch origin
              git reset --hard origin/main

              # ストレージディレクトリの復元（git reset で消える場合がある）
              mkdir -p storage/framework/{views,cache/data,sessions} storage/logs bootstrap/cache

              if [ -f composer.json ]; then
                composer install --no-dev --no-interaction --optimize-autoloader
              fi

              # CIでビルド済みのフロントエンドアセットをコピー
              mkdir -p public/assets/build
              rsync -a "$BASE/_shared/build/" public/assets/build/

              # パーミッション修正（www-data が書き込めるように）
              docker exec compose-php-1 chown www-data:www-data /var/www/apps/$SITE
              docker exec compose-php-1 chmod -R 777 /var/www/apps/$SITE/storage /var/www/apps/$SITE/bootstrap/cache

              # キャッシュはコンテナ内で実行（パスの不一致を防ぐ）
              if [ -f artisan ]; then
                docker exec compose-php-1 php /var/www/apps/$SITE/artisan config:clear
                docker exec compose-php-1 php /var/www/apps/$SITE/artisan view:clear
                docker exec compose-php-1 php /var/www/apps/$SITE/artisan route:clear
              fi
            done

            echo "=== Deploy complete ==="
