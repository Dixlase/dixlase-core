name: Build release distribution ZIP

# Produces the operator-facing distribution archive: dixlase-<tag>.zip
# with vendor/, public/assets/build/, and themes/DixlaseOnePage/ already
# installed. Operators extract → set up .env → visit the URL → the
# install wizard handles the rest, with no composer or npm step needed
# on the destination host.
#
# A versionless copy (dixlase-core.zip) is attached alongside so external
# links can use the static `releases/latest/download/dixlase-core.zip`
# URL — GitHub resolves it to whichever release is currently "Latest",
# so the brand site / docs do not need to be edited on every new tag.
#
# Trigger:
#   - `release: published` → automatically attaches both ZIPs to the
#     GitHub release as downloadable assets.
#   - `workflow_dispatch` → manual run for testing the build before
#     cutting a real release; result is uploaded as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (default: workflow run ref)'
        required: false
        default: ''
      bundle_theme:
        description: 'Bundle the official theme code + write .dixlase-release.json so the core updater applies themes/<slug>/ during update'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # required for softprops/action-gh-release to upload the asset

env:
  # PHP version used to build the bundled vendor/. composer.json pins
  # the platform to PHP 8.3 (Laravel 13 requires php ^8.3), so 8.3 is the
  # target — the resulting vendor/ runs on 8.3, 8.4, and 8.5+. Bumping this
  # is fine as long as the platform pin moves with it.
  PHP_VERSION: '8.3'
  NODE_VERSION: '24'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distribution ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          REF="${{ github.event.release.tag_name }}"
          [ -z "$REF" ] && REF="${{ inputs.tag }}"
          [ -z "$REF" ] && REF="${{ github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building from ref: $REF"

      - name: Checkout core at target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, zip, gd, intl, bcmath, pdo_mysql, sqlite3
          coverage: none
          tools: composer:v2

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Composer dependencies (production)
        # --no-dev keeps PHPUnit / Mockery / etc. out of the ZIP.
        # --optimize-autoloader pre-generates the classmap so the
        # operator's first request does not pay the autoload-warmup cost.
        # composer/installers routes dixlase/dixlase-onepage into
        # themes/DixlaseOnePage/ automatically (see composer.json
        # extra.installer-paths), so no separate clone step is needed.
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Re-generate autoload mappings after composer installed the theme
        # The bundled theme is created by composer/installers during the step
        # above, after merge-plugin read composer.local.json, so the dumped
        # autoloader does not map Themes\<Name>\App\ yet. Without this the
        # released vendor/ cannot autoload the theme's ServiceProvider, and
        # everything it registers is missing on a fresh install.
        run: |
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-dev --optimize --no-interaction --no-scripts

      - name: Install npm dependencies
        run: npm ci

      - name: Seed Tailwind plugin-sources stub
        # `resources/src/common/css/dixlase-tailwind-plugin-sources.css`
        # is auto-generated by
        # `php artisan dls:tailwind:regenerate-plugin-sources` whenever
        # a plugin is enabled / disabled / installed / uninstalled, and
        # is gitignored. Themes (DixlaseOnePage's `tailwind.css`) `@import`
        # it so Tailwind v4 picks up plugin-owned content sources at
        # build time. Without the file, vite stops with `ENOENT: no such
        # file or directory` and the bundled-theme assets step (below)
        # fails the release.
        #
        # The release CI does not install any plugin (the operator does
        # that post-install through the admin panel), so the file is
        # effectively empty — a header comment plus a "no enabled
        # plugins" marker. We write that empty form inline instead of
        # booting Laravel for the artisan command, which would otherwise
        # require an .env + key:generate + cache warmup here just to
        # produce a static file.
        run: |
          mkdir -p resources/src/common/css
          cat > resources/src/common/css/dixlase-tailwind-plugin-sources.css <<'CSS'
          /*
           * AUTO-GENERATED placeholder written by the release workflow.
           *
           * `php artisan dls:tailwind:regenerate-plugin-sources` rewrites
           * this file once the operator enables their first plugin. The
           * release CI ships an empty form because no plugin is
           * installed at build time.
           */

          /* No enabled plugin currently declares Tailwind content sources. */
          CSS

      - name: Build front-end assets
        # Populates public/assets/build/ so the operator does not need
        # Node on the destination host.
        run: npm run build

      - name: Build bundled-theme assets
        # composer/installers placed themes/DixlaseOnePage/ (and any
        # other dixlase-theme composer packages) during composer install
        # above. The theme ships only resources/ — no built public/
        # assets, no public symlink — so without this step the release
        # ZIP would extract into a UI that boots with "appearanceTheme
        # is not defined" Alpine errors and an unstyled login / install
        # / front page.
        #
        # We run npm directly rather than calling `php artisan
        # dls:theme:build`, because artisan would require a bootable
        # Laravel (.env, APP_KEY, …) which is extra ceremony in CI just
        # to shell out to npm. The relative public symlink we create is
        # the same one the artisan command writes — relative paths
        # survive ZIP extraction; an absolute path would point at the
        # CI runner's filesystem on the operator's machine.
        run: |
          set -e
          mkdir -p public/assets/themes
          shopt -s nullglob
          for theme_dir in themes/*/; do
            theme_name="$(basename "$theme_dir")"
            if [ -f "$theme_dir/package.json" ]; then
              echo "::group::Build theme: $theme_name"
              (cd "$theme_dir" && npm ci && npm run build)
              # Relative symlink: public/assets/themes/<name> → ../../../themes/<name>/resources/assets
              ln -sfn "../../../themes/$theme_name/resources/assets" "public/assets/themes/$theme_name"
              echo "::endgroup::"
            else
              echo "Skipping $theme_name (no package.json)"
            fi
          done

      - name: Clean dev-only artifacts before bundling
        run: |
          # node_modules is ~300MB and not needed at runtime — vite has
          # already emitted public/assets/build/ above.
          rm -rf node_modules

          # Same logic for each bundled theme's node_modules.
          find themes -mindepth 2 -maxdepth 2 -type d -name node_modules -prune -exec rm -rf {} +

          # Wipe runtime cache contents but keep .gitkeep so Laravel
          # finds the directory layout it expects on first boot.
          for d in storage/logs \
                   storage/framework/cache/data \
                   storage/framework/sessions \
                   storage/framework/views \
                   bootstrap/cache; do
            if [ -d "$d" ]; then
              find "$d" -type f ! -name '.gitkeep' -delete
            fi
          done

      - name: Stage distribution tree
        id: stage
        run: |
          TAG="${{ steps.ref.outputs.ref }}"
          WRAPPER="dist/dixlase-${TAG}"
          mkdir -p "$WRAPPER"

          # rsync into a wrapper directory so the ZIP extracts as
          # dixlase-<tag>/ rather than dumping files into whatever
          # directory the operator unzipped in.
          rsync -a --exclude-from=.github/release-dist-exclude.txt . "$WRAPPER/"

          # The exclude list is written for core and its patterns are not
          # anchored, so it also stripped CHANGELOG.md, CONTRIBUTING*,
          # SECURITY.md, tests/, phpunit.xml and .gitignore out of the
          # bundled theme. Those are signed files: the theme then failed
          # verification on every install from this ZIP, and without its
          # .gitignore the built resources/assets/ counted as extra files.
          # Copy each bundled theme again exactly as composer placed it
          # (the signed tree plus the CI-built assets).
          shopt -s nullglob
          for theme_dir in themes/*/; do
            theme_name="$(basename "$theme_dir")"
            rsync -a --delete --exclude=.git/ --exclude=node_modules/ \
              "$theme_dir" "$WRAPPER/themes/$theme_name/"
          done

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "Staged: $(du -sh "$WRAPPER" | cut -f1)"

      - name: Resolve theme bundling mode
        # Off by default. Two opt-in switches drive it on:
        #
        #   * workflow_dispatch input bundle_theme=true — used by dev when
        #     testing the theme-bundling path locally or building an
        #     ad-hoc pre-release for a sandbox E2E.
        #   * A `[bundle-theme]` marker anywhere in the release notes body
        #     — used when the operator publishes a real GitHub Release
        #     that must ship a matching theme update alongside core.
        #
        # When on, the next step writes .dixlase-release.json into the
        # payload root; CoreUpdater reads it and bootstraps each declared
        # themes/<slug>/ that is NOT yet installed (fresh
        # install-from-release). An already-installed theme is never
        # changed by a core update, whatever the bundled version — the
        # operator moves it via dls:theme:update / dls:theme:rollback.
        # Releases without the marker ship core only.
        id: bundle
        run: |
          BUNDLE=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bundle_theme }}" = "true" ]; then
            BUNDLE=true
            echo "Bundling requested via workflow_dispatch input."
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            BODY=$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH")
            if printf '%s' "$BODY" | grep -qF '[bundle-theme]'; then
              BUNDLE=true
              echo "Bundling requested via [bundle-theme] marker in release notes."
            fi
          fi

          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "Bundle mode: $BUNDLE"

      - name: Write .dixlase-release.json manifest
        if: steps.bundle.outputs.bundle == 'true'
        # Emits the manifest the core updater reads to decide which
        # themes to bootstrap alongside core. v1 supports exactly the
        # official theme (DixlaseOnePage); ReleaseManifest validates
        # the entry so a hostile ZIP cannot direct the updater at a
        # path outside themes/<slug>/. Version comes from the theme's
        # own theme.json so code, manifest and DB metadata line up.
        run: |
          set -e
          WRAPPER="${{ steps.stage.outputs.wrapper }}"
          THEME_JSON="$WRAPPER/themes/DixlaseOnePage/theme.json"

          if [ ! -f "$THEME_JSON" ]; then
            echo "::error::Bundle mode is on but $THEME_JSON does not exist. The theme is installed during composer install; check that the dixlase/dixlase-onepage dependency resolved."
            exit 1
          fi

          THEME_VERSION=$(jq -r .version "$THEME_JSON")
          if [ -z "$THEME_VERSION" ] || [ "$THEME_VERSION" = "null" ]; then
            echo "::error::$THEME_JSON has no 'version' field; cannot bundle without a version."
            exit 1
          fi

          RELEASE_TAG="${{ steps.stage.outputs.tag }}"
          # Strip a leading 'v' so the manifest 'version' matches the
          # semver form the updater compares against
          # core_releases.available_version (also stored without 'v').
          RELEASE_VERSION="${RELEASE_TAG#v}"

          MANIFEST="$WRAPPER/.dixlase-release.json"
          cat > "$MANIFEST" <<EOF
          {
            "version": "$RELEASE_VERSION",
            "bundled_themes": [
              {
                "slug": "DixlaseOnePage",
                "version": "$THEME_VERSION",
                "path": "themes/DixlaseOnePage"
              }
            ]
          }
          EOF
          echo "Wrote manifest:"
          cat "$MANIFEST"

      - name: Verify bundled themes carry every signed file
        # The theme's signature lists its files in theme.json `files`. A
        # file missing from the ZIP makes the installed theme "tampered",
        # so fail the release here instead.
        run: |
          set -e
          shopt -s nullglob
          for theme_json in "${{ steps.stage.outputs.wrapper }}"/themes/*/theme.json; do
            theme_dir="$(dirname "$theme_json")"
            php -r '
              $dir = $argv[1];
              $manifest = json_decode(file_get_contents($dir."/theme.json"), true);
              $files = array_keys($manifest["files"] ?? []);
              if ($files === []) { echo basename($dir).": unsigned, nothing to check\n"; exit(0); }
              $missing = array_values(array_filter($files, fn ($f) => ! is_file($dir."/".$f)));
              if ($missing !== []) {
                  fwrite(STDERR, "::error::".basename($dir)." is missing signed files: ".implode(", ", $missing)."\n");
                  exit(1);
              }
              echo basename($dir).": all ".count($files)." signed files present\n";
            ' "$theme_dir"
          done

      - name: Build ZIP
        id: zip
        run: |
          ZIP_NAME="dixlase-${{ steps.stage.outputs.tag }}.zip"
          LATEST_ALIAS="dixlase-core.zip"
          (cd dist && zip -rq "../$ZIP_NAME" "dixlase-${{ steps.stage.outputs.tag }}")
          # Versionless alias of the same archive. Lets external links use
          # the static `releases/latest/download/dixlase-core.zip` URL,
          # which GitHub auto-resolves to whichever release is currently
          # published as "Latest" — no need to update download links on
          # the brand site / docs each time a new tag ships.
          cp "$ZIP_NAME" "$LATEST_ALIAS"
          # checksums.sha256 lists both archives. The core updater checks
          # the archive it downloads against it (security review D13), and
          # the one-line installer can do the same.
          sha256sum "$ZIP_NAME" "$LATEST_ALIAS" > checksums.sha256
          cat checksums.sha256
          echo "name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "latest_alias=$LATEST_ALIAS" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP_NAME" "$LATEST_ALIAS"

      - name: Verify bundled vendor/ retained critical framework assets
        # Regression pin for Round 4 Finding A: an overly broad `dist/`
        # exclude used to strip framework assets that the exception-page
        # renderer needs at runtime, so any error during update/rollback
        # rendered as a file_get_contents fatal instead of the real cause.
        # If a future exclude change re-introduces the strip we want the
        # release build to fail here rather than ship a broken ZIP.
        run: |
          CRITICAL="dixlase-${{ steps.stage.outputs.tag }}/vendor/laravel/framework/src/Illuminate/Foundation/resources/exceptions/renderer/dist/styles.css"
          if ! unzip -l "${{ steps.zip.outputs.name }}" | grep -qF "$CRITICAL"; then
            echo "::error::Release ZIP is missing $CRITICAL. This means the exception-page renderer cannot render at runtime — any error during an install / update / rollback will surface as a file_get_contents fatal that hides the real cause. Check .github/release-dist-exclude.txt for an overly broad exclude pattern (see Round 4 Finding A)."
            exit 1
          fi
          echo "vendor/ retains the framework's exception-renderer dist/ assets."

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.zip.outputs.name }}
            ${{ steps.zip.outputs.latest_alias }}
            checksums.sha256

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          retention-days: 30
