name: Security Scan

on:
  push:
    branches:
      - next
      - main
  pull_request:
    branches:
      - next
      - main
  schedule:
    # 毎週月曜日 9:00 JST (0:00 UTC)
    - cron: '0 0 * * 1'

# Cancel older runs on the same ref when a new one starts.
# Saves Actions minutes on rebases / quick consecutive pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Dependency Audit
  # ============================================
  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer Audit (capture report)
        run: composer audit --format=json > composer-audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: composer-audit
          path: composer-audit.json
          retention-days: 30

      - name: Composer Audit (gate build)
        run: composer audit --no-dev

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit (capture report)
        run: npm audit --json > npm-audit.json || true

      - name: Upload audit results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30

      # Gate only on production-dependency vulnerabilities. dev-only
      # advisories (e.g. esbuild dev-server CVEs surfaced via vite) are
      # still recorded in the capture step's artifact for visibility but
      # do not block the build, because the production assets emitted by
      # `vite build` do not embed esbuild and never expose the dev server.
      # Real prod-dep regressions still fail the build immediately.
      - name: NPM Audit (gate build on high severity, prod deps only)
        run: npm audit --audit-level=high --omit=dev

  # ============================================
  # PHPStan Static Analysis
  # ============================================
  phpstan:
    name: PHPStan Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --error-format=json > phpstan-results.json || true

      - name: Upload PHPStan results
        uses: actions/upload-artifact@v6
        with:
          name: phpstan-results
          path: phpstan-results.json
          retention-days: 30

  # ============================================
  # Security Summary Report
  # ============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [composer-audit, npm-audit, phpstan, semgrep]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: security-reports

      - name: Generate Summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Composer Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/composer-audit/composer-audit.json ]; then
            COMPOSER_VULNS=$(cat security-reports/composer-audit/composer-audit.json | jq -r '.advisories | length // 0' 2>/dev/null || echo "0")
            echo "- Vulnerabilities found: **$COMPOSER_VULNS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Results not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## NPM Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/npm-audit/npm-audit.json ]; then
            NPM_VULNS=$(cat security-reports/npm-audit/npm-audit.json | jq -r '.metadata.vulnerabilities.total // 0' 2>/dev/null || echo "0")
            echo "- Vulnerabilities found: **$NPM_VULNS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Results not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## PHPStan Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/phpstan-results/phpstan-results.json ]; then
            PHPSTAN_ERRORS=$(cat security-reports/phpstan-results/phpstan-results.json | jq -r '.totals.file_errors // 0' 2>/dev/null || echo "0")
            echo "- Errors found: **$PHPSTAN_ERRORS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Results not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Semgrep SAST" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.semgrep.outputs.findings }}" ]; then
            echo "- Findings: **${{ needs.semgrep.outputs.findings }}** (details in code scanning)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Results not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Scan completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')_" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # SAST (Static Application Security Testing)
  # ============================================
  # Findings go to code scanning as SARIF, never to the log: this repository
  # is public, so the log is readable by anyone, while code scanning alerts
  # are not. The log carries the count only (#1017).
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.183.0
    outputs:
      findings: ${{ steps.scan.outputs.findings }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Semgrep
        id: scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan \
            --config p/php \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off --quiet \
            --sarif --output semgrep.sarif || true
          if [ ! -s semgrep.sarif ]; then
            echo "Semgrep produced no report" >&2
            exit 1
          fi
          # A finding silenced with a `nosemgrep` comment stays in the SARIF
          # with `suppressions`; it is not counted.
          FINDINGS=$(python3 -c "import json; print(sum(1 for r in json.load(open('semgrep.sarif'))['runs'] for x in r.get('results', []) if not x.get('suppressions')))")
          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "Semgrep findings: $FINDINGS"

      # A pull request from a fork gets a read-only token, so the upload is
      # skipped there; the gate below still fails on a finding.
      - name: Upload SARIF to code scanning
        if: always() && steps.scan.outputs.findings != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Fail on findings
        if: steps.scan.outputs.findings != '0'
        run: |
          echo "Semgrep reported ${{ steps.scan.outputs.findings }} finding(s). Details are in the repository's code scanning alerts." >&2
          exit 1
