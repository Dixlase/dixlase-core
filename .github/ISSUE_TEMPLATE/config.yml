blank_issues_enabled: false
contact_links:
  - name: Read first — current contribution policy / 最初にお読みください — 現在のコントリビューション方針
    url: https://github.com/Dixlase/dixlase-core/blob/main/CONTRIBUTING.md
    about: >-
      Dixlase is in early development. External pull requests are NOT
      currently accepted; bug reports and discussions are welcome. Code
      snippets posted in Issues are treated as reference only — a maintainer
      will rewrite any fix independently. This is required for the dual-license
      model until the CLA's formal legal review is complete.
      / Dixlase は初期開発期にあり、外部からの Pull Request は現在受け付けていません。
      バグ報告と Discussions は歓迎します。Issue 内のコードスニペットは参考情報として扱い、
      メンテナーが独立して書き直します。これは CLA 法務レビュー完了までの暫定運用です。
  - name: Security Vulnerability / セキュリティ脆弱性の報告
    url: https://github.com/Dixlase/dixlase-core/security/advisories/new
    about: >-
      Do NOT report security vulnerabilities in public issues. Use GitHub's
      private vulnerability reporting or email security@dixlase.org. See
      SECURITY.md for details. / セキュリティ脆弱性は公開 Issue で報告せず、
      GitHub のプライベート脆弱性報告または security@dixlase.org へメールしてください。
      詳細は SECURITY.md を参照。
  - name: Question / 質問・相談
    url: https://github.com/Dixlase/dixlase-core/discussions
    about: >-
      For usage questions, ideas, or general discussion, please use GitHub
      Discussions. / 使い方の質問やアイディア共有は GitHub Discussions へ。
