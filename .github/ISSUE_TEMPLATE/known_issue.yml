name: Known issue (maintainers) / 既知の問題(メンテナー用)
description: A problem a maintainer found and wants tracked in public / メンテナーが見つけ、公開で追う問題
body:
  - type: markdown
    attributes:
      value: |
        Title: `<area>: <English summary> / <日本語の要約>`. Add one type label and at least one `area:` label. See the [issue guidelines](https://github.com/Dixlase/dixlase-core/blob/main/docs/development/issues.md).
        タイトルは `<領域>: <英語の要約> / <日本語の要約>`。種類のラベルを 1 つ、`area:` ラベルを 1 つ以上付けます。[Issue の書き方](https://github.com/Dixlase/dixlase-core/blob/main/docs/ja/development/issues.md)を参照。

        Write the whole body in English first, then the whole body in Japanese below the `---` line. Do not interleave the two languages section by section.
        本文は、まず英語をひととおり書き、`---` の下に日本語をひととおり書きます。項目ごとに英日を交互に書かないでください。

        **Never file an unfixed vulnerability here.** / **修正前の脆弱性はここに書かないでください。**
  - type: textarea
    id: body
    attributes:
      label: Body / 本文
      description: Fill in every section in both languages. "Proposed fix" may be left empty. / 両方の言語で各項目を埋めてください。「直し方の案」は空でもかまいません。
      value: |
        ### What happens



        ### Impact



        ### Reproduction



        ### Cause



        ### Proposed fix



        ### Done when



        ---

        ### 何が起きるか



        ### 影響



        ### 再現手順



        ### 原因



        ### 直し方の案



        ### 完了の条件


    validations:
      required: true
